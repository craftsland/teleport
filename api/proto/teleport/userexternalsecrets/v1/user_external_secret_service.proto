syntax = "proto3";

package teleport.userexternalsecrets.v1;

import "teleport/userexternalsecrets/v1/user_external_secret.proto";

option go_package = "github.com/gravitational/teleport/api/gen/proto/go/teleport/userexternalsecrets/v1;userexternalsecretsv1";

// UserExternalSecretService provides methods to manage double-encrypted
// external secrets for users.
service UserExternalSecretService {
  // GetUserExternalSecret returns the double-encrypted secret for the calling
  // user's current session. Auth identifies the session from the caller's
  // registered encryption key.
  rpc GetUserExternalSecret(GetUserExternalSecretRequest) returns (GetUserExternalSecretResponse);

  // CreateUserExternalSecret creates a double-encrypted secret for a target
  // session. The caller sends the auth-encrypted (KMS) blob. Auth validates
  // the blob hash, encrypts it with the target session's public key, and
  // stores the result. The caller must be the same user as the target session.
  rpc CreateUserExternalSecret(CreateUserExternalSecretRequest) returns (CreateUserExternalSecretResponse);

  // ListUserExternalSecrets returns all secrets for the calling user's
  // encryption key. The key ID is read from the caller's TLS certificate or
  // the optional encryption_key_id field.
  rpc ListUserExternalSecrets(ListUserExternalSecretsRequest) returns (ListUserExternalSecretsResponse);

  // DecryptUserExternalSecret decrypts a double-encrypted secret. Auth strips
  // the auth-encrypted layer (inner encryption managed by auth's keystore) and
  // verifies the payload binding (user + resource) before returning the
  // plaintext. The caller must be a trusted service (e.g. proxy).
  rpc DecryptUserExternalSecret(DecryptUserExternalSecretRequest) returns (DecryptUserExternalSecretResponse);

  // SyncUserExternalSecrets syncs the caller's secrets to other sessions.
  // Auth reads the caller's double-encrypted secrets, sends decrypt requests
  // to the client, then re-encrypts for target sessions. The client acts as
  // a decrypt oracle -- it never sees the target sessions or controls the
  // sync logic.
  rpc SyncUserExternalSecrets(stream SyncUserExternalSecretsRequest) returns (stream SyncUserExternalSecretsResponse);
}

// GetUserExternalSecretRequest is a request to retrieve a double-encrypted secret.
message GetUserExternalSecretRequest {
  // resource_kind is the kind of resource the secret is for (e.g. "git_server").
  string resource_kind = 1;
  // resource_name is the name of the resource (e.g. "github-my-org").
  string resource_name = 2;
  // encryption_key_id optionally specifies which encryption key's secret to
  // fetch. If empty, the key ID is read from the caller's TLS certificate.
  // Used by delegated sessions (beams) where the encryption key is registered
  // separately from the certificate.
  string encryption_key_id = 3;
}

// GetUserExternalSecretResponse contains the double-encrypted secret resource.
message GetUserExternalSecretResponse {
  // secret is the full UserExternalSecret resource containing the
  // double-encrypted blobs (e.g. access_token_blob and refresh_token_blob).
  UserExternalSecret secret = 1;
}

// CreateUserExternalSecretRequest is a request to create a double-encrypted
// secret for a target session.
message CreateUserExternalSecretRequest {
  // resource_kind is the kind of resource the secret is for (e.g. "git_server").
  string resource_kind = 1;
  // resource_name is the name of the resource (e.g. "github-my-org").
  string resource_name = 2;
  // target_encryption_key_id is the encryption key ID of the target session.
  // Auth will look up the corresponding public key and encrypt the blob for it.
  string target_encryption_key_id = 3;
  // auth_encrypted_secret holds the auth-encrypted (KMS) blobs that the caller
  // has user-decrypted (stripped outer ECIES layer). Auth will re-encrypt
  // these with the target session's public key.
  OAuthSecret auth_encrypted_secret = 4;
}

// CreateUserExternalSecretResponse is the response for CreateUserExternalSecret.
message CreateUserExternalSecretResponse {
  // secret is the created UserExternalSecret resource.
  UserExternalSecret secret = 1;
}

// ListUserExternalSecretsRequest is a request to list secrets for the caller.
// The encryption key ID is read from the caller's TLS certificate.
message ListUserExternalSecretsRequest {
  // page_size is the maximum number of secrets to return.
  int32 page_size = 1;
  // page_token is the pagination token from a previous response.
  string page_token = 2;
}

// ListUserExternalSecretsResponse contains the caller's secrets.
message ListUserExternalSecretsResponse {
  // secrets is the list of double-encrypted secrets for the caller's key.
  repeated UserExternalSecret secrets = 1;
  // next_page_token is the token for the next page. Empty if no more pages.
  string next_page_token = 2;
}

// DecryptUserExternalSecretRequest is a request to decrypt a secret.
message DecryptUserExternalSecretRequest {
  // auth_encrypted_blob is the auth-encrypted payload to decrypt. The caller
  // must have already stripped the outer ECIES layer.
  bytes auth_encrypted_blob = 1;
}

// DecryptUserExternalSecretResponse contains the decrypted plaintext.
message DecryptUserExternalSecretResponse {
  // plaintext is the decrypted secret value.
  bytes plaintext = 1;
}

// SyncUserExternalSecretsRequest is a client message on the sync stream.
message SyncUserExternalSecretsRequest {
  oneof request {
    // sync_request initiates the sync operation.
    SyncRequest sync_request = 1;
    // decrypt_response is the client's response to a decrypt request.
    SyncDecryptResponse decrypt_response = 2;
  }
}

// SyncRequest initiates a sync operation.
message SyncRequest {
  // target_encryption_key_id syncs to a specific session. If empty, syncs to
  // all other sessions that don't already have the secret.
  string target_encryption_key_id = 1;
}

// SyncDecryptResponse is the client's response to a decrypt request during sync.
message SyncDecryptResponse {
  // plaintext is the decrypted data (auth-encrypted blob).
  bytes plaintext = 1;
}

// SyncUserExternalSecretsResponse is a server message on the sync stream.
message SyncUserExternalSecretsResponse {
  oneof response {
    // decrypt_request asks the client to decrypt an ECIES-encrypted blob.
    SyncDecryptRequest decrypt_request = 1;
  }
}

// SyncDecryptRequest asks the client to decrypt an ECIES-encrypted blob
// during a sync operation.
message SyncDecryptRequest {
  // ciphertext is the ECIES-encrypted data.
  bytes ciphertext = 1;
  // resource_kind is the kind of resource being synced (e.g. "git_server").
  string resource_kind = 2;
  // resource_name is the name of the resource being synced (e.g. "github-greedy52-org").
  string resource_name = 3;
}

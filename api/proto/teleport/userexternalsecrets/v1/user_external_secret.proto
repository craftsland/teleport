syntax = "proto3";

package teleport.userexternalsecrets.v1;

import "google/protobuf/timestamp.proto";
import "teleport/header/v1/metadata.proto";

option go_package = "github.com/gravitational/teleport/api/gen/proto/go/teleport/userexternalsecrets/v1;userexternalsecretsv1";

// UserExternalSecret stores per-user per-session double-encrypted secrets for
// external services. Each secret is encrypted with two layers:
// - Inner: KMS encryption (only auth can decrypt)
// - Outer: ECIES per-session encryption (only the session holder can decrypt)
//
// This resource is keyed by user, secret type, client ID, and encryption key ID.
// Only Auth accesses this resource directly (no cache).
message UserExternalSecret {
  string kind = 1;
  string sub_kind = 2;
  string version = 3;
  teleport.header.v1.Metadata metadata = 4;
  UserExternalSecretSpec spec = 5;
  UserExternalSecretStatus status = 6;
}

// UserExternalSecretSpec holds the secret details. These fields are set by
// the creator and not modified by Teleport at runtime.
message UserExternalSecretSpec {
  // user is the Teleport username that owns this secret.
  string user = 1;
  // secret_type identifies the kind of external secret (e.g. "github_oauth").
  string secret_type = 2;
  // client_id identifies the external OAuth application.
  string client_id = 3;
  // public_key is the ECIES P-256 public key (PKIX DER) of the session
  // that holds the decryption key. The encryption_key_id in the storage
  // path is derived from this as uuid.NewSHA1(NameSpaceOID, public_key).
  bytes public_key = 4;
  // secret holds the double-encrypted secret data.
  oneof secret {
    OAuthSecret oauth = 5;
  }
}

// OAuthSecret holds double-encrypted OAuth tokens. Each blob is independently
// double-encrypted: ECIES(KMS(EncryptedPayload{user, payload})).
message OAuthSecret {
  // access_token_blob is the double-encrypted access token.
  bytes access_token_blob = 1;
  // refresh_token_blob is the double-encrypted refresh token.
  bytes refresh_token_blob = 2;
  // access_token_expiry is when the access token expires.
  google.protobuf.Timestamp access_token_expiry = 3;
  // refresh_token_expiry is when the refresh token expires.
  google.protobuf.Timestamp refresh_token_expiry = 4;
}

// EncryptedPayload is the plaintext structure inside the KMS envelope.
// It binds the secret to the owning user to prevent cross-user token theft.
message EncryptedPayload {
  // user is the Teleport username. Auth verifies this matches the caller.
  string user = 1;
  // payload is the raw secret value (e.g. the access token string).
  bytes payload = 2;
}

// UserExternalSecretStatus contains dynamic properties set by auth at runtime.
message UserExternalSecretStatus {
  oneof secret_status {
    OAuthSecretStatus oauth = 1;
  }
}

// OAuthSecretStatus holds hashes of the auth-encrypted (KMS) OAuth token blobs.
// Auth computes these when first creating the blobs during OAuth and uses them
// to verify that clients submitting blobs for re-encryption have the correct,
// unmodified auth-encrypted blobs.
message OAuthSecretStatus {
  // access_token_hash is SHA-256 of the auth-encrypted access token blob.
  bytes access_token_hash = 1;
  // refresh_token_hash is SHA-256 of the auth-encrypted refresh token blob.
  bytes refresh_token_hash = 2;
}

// UserEncryptionKeys is a single resource per user that holds all registered
// ECIES P-256 encryption public keys. Each key is associated with a session
// (tsh login, delegation, browser) and is used for double-encrypted credential
// distribution.
message UserEncryptionKeys {
  // The kind of resource represented. Always "user_encryption_keys".
  string kind = 1;
  // Differentiates variations of the same kind.
  string sub_kind = 2;
  // The version of the resource being represented.
  string version = 3;
  // Common metadata that all resources share.
  teleport.header.v1.Metadata metadata = 4;
  // Spec contains the list of encryption keys.
  UserEncryptionKeysSpec spec = 5;
}

// UserEncryptionKeysSpec contains the encryption keys for a user.
message UserEncryptionKeysSpec {
  // keys is the list of registered encryption keys.
  repeated EncryptionKeyEntry keys = 1;
}

// EncryptionKeyEntry represents a single per-session encryption key.
message EncryptionKeyEntry {
  // key_id is the unique identifier for this key.
  string key_id = 1;
  // public_key is the ECIES P-256 public key (DER-encoded PKIX).
  bytes public_key = 2;
  // created_at is when this key was registered.
  google.protobuf.Timestamp created_at = 3;
  // expires is when this key expires (matches session cert TTL).
  google.protobuf.Timestamp expires = 4;
}
